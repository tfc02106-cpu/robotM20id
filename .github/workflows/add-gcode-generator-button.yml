name: Add G-code generator launch button

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-gcode-generator-button.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add launch button to index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = 'id="openGcodeGenerator"'
          if marker in text:
              print('G-code generator button already exists; no change required.')
              raise SystemExit(0)

          css_anchor = '    .subtitle { margin: 0 0 14px 49px; color: var(--muted); font-size: 12px; }\n'
          css = '''
    .gcode-generator-launch {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0 0 14px 49px; padding: 10px 13px;
      border: 1px solid rgba(168, 239, 255, .68); border-radius: 10px;
      color: #06131f; text-decoration: none; font-size: 12px; font-weight: 900;
      background: linear-gradient(135deg, #8fffc9, #55c8ff);
      box-shadow: 0 8px 22px rgba(45, 178, 232, .24);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .gcode-generator-launch:hover {
      transform: translateY(-1px); filter: brightness(1.08);
      box-shadow: 0 10px 26px rgba(45, 178, 232, .34);
    }
    .gcode-generator-launch:focus-visible {
      outline: 3px solid rgba(143, 255, 201, .5); outline-offset: 2px;
    }
'''
          if css_anchor not in text:
              raise RuntimeError('CSS insertion point was not found in index.html')
          text = text.replace(css_anchor, css_anchor + css, 1)

          html_anchor = '    <p class="subtitle">A 畫 O → B 畫 X｜雙臂 Cartesian G-code-like｜Three.js + WebGPU</p>\n'
          button = '''
    <a
      id="openGcodeGenerator"
      class="gcode-generator-launch"
      href="https://tfc02106-cpu.github.io/RobotM20GCG/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="在新視窗開啟雙臂 G-code 產生器"
    >
      <span>開啟雙臂 G-code 產生器</span><span aria-hidden="true">↗</span>
    </a>
'''
          if html_anchor not in text:
              raise RuntimeError('HTML insertion point was not found in index.html')
          text = text.replace(html_anchor, html_anchor + button, 1)

          path.write_text(text, encoding='utf-8')
          print('Button inserted successfully.')
          PY

      - name: Commit updated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add G-code generator launch button"
          git push
