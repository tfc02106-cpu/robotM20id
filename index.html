<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FANUC M-20iD/25 A/B 雙臂模擬</title>
  <style>
    :root { color-scheme: dark; --bar-h: 74px; --text:#eef9ff; --muted:#bfd6e9; --line:rgba(159,218,255,.36); }
    * { box-sizing: border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { font-family: Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; background:#0b1c31; color:var(--text); }
    .topbar {
      height:var(--bar-h); display:flex; align-items:center; justify-content:space-between; gap:18px;
      padding:10px 18px; border-bottom:1px solid var(--line);
      background:radial-gradient(circle at 72% 0%,rgba(77,197,255,.28),transparent 40%),linear-gradient(135deg,#102b49,#173e64);
      box-shadow:0 8px 24px rgba(0,0,0,.28); position:relative; z-index:10;
    }
    .brand { min-width:0; }
    .brand strong { display:block; font-size:16px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand span { display:block; margin-top:3px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .launch {
      flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:8px;
      min-height:46px; padding:0 18px; border:1px solid rgba(191,255,224,.84); border-radius:12px;
      color:#06151e; text-decoration:none; font-size:14px; font-weight:900;
      background:linear-gradient(135deg,#92ffd0,#5bc9ff); box-shadow:0 10px 26px rgba(62,195,235,.30);
      transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
    }
    .launch:hover { transform:translateY(-1px); filter:brightness(1.08); box-shadow:0 12px 30px rgba(62,195,235,.42); }
    .launch:focus-visible { outline:3px solid rgba(146,255,208,.5); outline-offset:3px; }
    iframe { width:100%; height:calc(100% - var(--bar-h)); border:0; display:block; background:#0b1c31; }
    @media (max-width:720px) {
      :root { --bar-h:108px; }
      .topbar { align-items:stretch; flex-direction:column; gap:7px; padding:9px 12px; }
      .brand strong { font-size:14px; }
      .brand span { font-size:10px; }
      .launch { min-height:40px; font-size:13px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>FANUC M-20iD/25 A/B 雙臂模擬</strong>
      <span>按右側按鈕，另開分頁啟動雙臂 G-code 產生器</span>
    </div>
    <a class="launch" href="https://tfc02106-cpu.github.io/RobotM20GCG/" target="_blank" rel="noopener noreferrer" aria-label="在新分頁開啟雙臂 G-code 產生器">
      開啟雙臂 G-code 產生器 <span aria-hidden="true">↗</span>
    </a>
  </header>
  <iframe src="./simulator.html" title="FANUC M-20iD/25 A/B 雙臂模擬器"></iframe>
</body>
</html>
